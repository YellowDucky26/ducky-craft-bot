# Starten: zet je ingevulde bot.env naast dit bestand en draai `docker compose up -d`.
# Updaten: `docker compose pull && docker compose up -d`.
#
# Image-tags: :latest = laatste release, :1 / :1.2 = vastzetten op een versie,
# :main = elke push naar main (nieuwste, maar nog niet uitgebracht).
services:
  ducky-craft-bot:
    image: ghcr.io/yellowducky26/ducky-craft-bot:latest
    container_name: ducky-craft-bot
    restart: unless-stopped
    env_file: bot.env
    environment:
      DATA_DIR: /data
    volumes:
      - ducky-bot-data:/data
    ports:
      - "8688:8688"

volumes:
  ducky-bot-data:
